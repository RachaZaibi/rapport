<style>
#erd { width: 100%; overflow-x: auto; }
#erd svg { max-width: 100%; height: auto; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
    primaryBorderColor: dark ? '#AFA9EC' : '#534AB7',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryTextColor: dark ? '#9FE1CB' : '#085041',
    secondaryBorderColor: dark ? '#5DCAA5' : '#0F6E56',
    tertiaryColor: dark ? '#633806' : '#FAEEDA',
    tertiaryTextColor: dark ? '#FAC775' : '#633806',
    tertiaryBorderColor: dark ? '#EF9F27' : '#854F0B',
  },
});

const diagram = `erDiagram
  USERS {
    int id PK
    string nom
    string prenom
    string email
    string mot_de_passe
    enum role
    boolean actif
    timestamp created_at
  }
  ROLES {
    int id PK
    string nom
    string description
  }
  EQUIPEMENTS {
    int id PK
    string nom
    string numero_serie
    enum type
    enum statut
    date date_acquisition
    date date_garantie
    int utilisateur_id FK
    int local_id FK
  }
  LOCAUX {
    int id PK
    string nom
    string batiment
    int etage
  }
  LICENCES {
    int id PK
    string nom_logiciel
    string cle_licence
    int nb_postes
    date date_expiration
    int equipement_id FK
  }
  TICKETS {
    int id PK
    string titre
    text description
    enum priorite
    enum statut
    int demandeur_id FK
    int technicien_id FK
    int equipement_id FK
    timestamp created_at
    timestamp updated_at
  }
  INTERVENTIONS {
    int id PK
    text description
    date date_intervention
    enum statut
    int ticket_id FK
    int technicien_id FK
  }
  MAINTENANCES {
    int id PK
    string titre
    text description
    enum type
    date date_prevue
    date date_realisation
    int equipement_id FK
    int technicien_id FK
  }
  AUDIT_LOGS {
    int id PK
    string action
    string table_cible
    int enregistrement_id
    int utilisateur_id FK
    timestamp created_at
  }

  USERS }o--|| ROLES : "appartient à"
  EQUIPEMENTS }o--o| USERS : "affecté à"
  EQUIPEMENTS }o--|| LOCAUX : "situé dans"
  LICENCES }o--|| EQUIPEMENTS : "installée sur"
  TICKETS }o--|| USERS : "créé par"
  TICKETS }o--o| USERS : "assigné à"
  TICKETS }o--o| EQUIPEMENTS : "concerne"
  INTERVENTIONS ||--|| TICKETS : "issue de"
  INTERVENTIONS }o--|| USERS : "réalisée par"
  MAINTENANCES }o--|| EQUIPEMENTS : "planifiée sur"
  MAINTENANCES }o--|| USERS : "assignée à"
  AUDIT_LOGS }o--|| USERS : "tracée pour"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
